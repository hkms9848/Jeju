<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🍊 제주도 3박 4일</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></head><body><header><div><h1 id="title">🍊 제주도 3박 4일</h1><small>우리끼리 함께 만드는 제주 여행</small></div><div class="actions"><span id="status">로컬 데모</span><button id="share">공유</button><button data-tab="settings">설정</button></div></header><nav id="tabs"></nav><main id="content"></main><dialog id="editor"><form id="placeForm" method="dialog"><h2>장소 편집</h2><label>장소명<input name="name" required></label><label>주소<input name="address"></label><div class="pair"><label>위도<input name="lat" type="number" step="any" required></label><label>경도<input name="lng" type="number" step="any" required></label></div><label>카테고리<select name="category"><option>관광지</option><option>맛집</option><option>카페</option><option>숙소</option><option>공항</option><option>쇼핑</option><option>기타</option></select></label><div class="pair"><label>방문 시간<input name="time" type="time"></label><label>체류(분)<input name="duration" type="number" min="0"></label></div><label>예상 비용<input name="cost" type="number" min="0"></label><label>장소 링크<input name="url" type="url"></label><label>메모<textarea name="memo"></textarea></label><div class="actions"><button type="button" id="cancelEditor">취소</button><button type="submit" class="primary">저장</button></div></form></dialog><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script type="module" src="app.js"></script></body></html>
